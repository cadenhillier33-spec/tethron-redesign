<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tethron — Loading</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #05070a;
    font-family: 'Space Grotesk', monospace;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 800px 500px at 50% 50%, rgba(0, 212, 232, 0.08) 0%, transparent 60%),
      linear-gradient(180deg, #080c10 0%, #04060a 100%);
    z-index: -1;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 20px;
  }

  /* Rotating chrome knot spinner */
  .spinner {
    position: relative;
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spinner::before {
    content: '';
    position: absolute;
    inset: -30px;
    background: radial-gradient(ellipse at center, rgba(0, 212, 232, 0.2) 0%, transparent 60%);
    filter: blur(40px);
    z-index: 0;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .spinner img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
    animation: rotate 6s linear infinite;
    filter: drop-shadow(0 0 30px rgba(0, 212, 232, 0.4));
  }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.1); }
  }

  /* Loading text with cyan shimmer */
  .status {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    background: #00d4e8;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(0, 212, 232, 0.8);
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Optional progress bar */
  .progress {
    width: 280px;
    height: 2px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 30%;
    background: linear-gradient(90deg, transparent, #00d4e8, transparent);
    animation: progress 2s linear infinite;
  }
  @keyframes progress {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }

  .brand {
    position: absolute;
    bottom: 40px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.25);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="spinner">
      <img src="/sculpture-v2.png" alt="Loading">
    </div>
    <div class="status">
      <span class="status-dot"></span>
      Installing your AI employee
    </div>
    <div class="progress">
      <div class="progress-fill"></div>
    </div>
    <div class="brand">Tethron &nbsp;·&nbsp; tethron.ai</div>
  </div>
</body>
</html>
