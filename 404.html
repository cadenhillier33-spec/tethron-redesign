<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-[#07080a] text-white dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Tethron</title>
  <meta name="robots" content="noindex">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background-color: #07080a;
      color: #f9f9f9;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      font-weight: 500;
      letter-spacing: 0.2px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -3;
      background-color: #07080a;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    }

    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(0,212,232,0.1) 0%, transparent 60%);
      filter: blur(80px);
      z-index: -2;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .sculpture {
      width: 280px;
      height: 280px;
      object-fit: contain;
      margin-bottom: 40px;
      filter: drop-shadow(0 0 60px rgba(0,212,232,0.3));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .eyebrow {
      font-family: 'Space Grotesk', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00d4e8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 32px;
      height: 1px;
      background: rgba(0,212,232,0.4);
    }

    h1 {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 18px;
      color: #fff;
    }
    h1 span {
      background: linear-gradient(115deg, #ffffff 30%, #00d4e8 50%, #ffffff 70%);
      background-size: 200% 100%;
      background-position: 50% 0;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0,212,232,0.3));
    }

    p {
      font-size: 17px;
      color: rgba(255,255,255,0.6);
      max-width: 520px;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: linear-gradient(135deg, rgba(0,212,232,0.15), rgba(0,212,232,0.05));
      border: 1px solid rgba(0,212,232,0.35);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(20px) saturate(1.8);
    }
    .btn:hover {
      background: linear-gradient(135deg, rgba(0,212,232,0.25), rgba(0,212,232,0.1));
      border-color: rgba(0,212,232,0.55);
      transform: translateY(-1px);
      box-shadow: 0 12px 40px rgba(0,212,232,0.2);
    }

    .footer {
      position: absolute;
      bottom: 24px;
      font-family: 'Space Grotesk', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="ambient-glow"></div>

  <div class="wrap">
    <img class="sculpture" src="/sculpture-v2.png" alt="Tethron">

    <div class="eyebrow">Error 404</div>
    <h1>This page <span>installed incorrectly.</span></h1>
    <p>The page you're looking for doesn't exist, was moved, or never clocked in. Head back home and we'll pretend this never happened.</p>

    <a href="/" class="btn">Back to tethron.ai &rarr;</a>

    <div class="footer">Tethron &nbsp;·&nbsp; tethron.ai</div>
  </div>
</body>
</html>
