<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tethron LinkedIn Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 4K NATIVE — 2x dimensions for sharp retina quality */
  .banner {
    width: 3168px;
    height: 792px;
    position: relative;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #fff;
    background: #05070a;
  }

  /* Background gradient */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 1400px 900px at 50% 55%, rgba(0, 180, 230, 0.12) 0%, transparent 60%),
      linear-gradient(180deg, #080c10 0%, #04060a 100%);
  }

  /* Subtle film grain */
  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  /* Edge vignette */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 2800px 1200px at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
    pointer-events: none;
  }

  /* TOP-LEFT TETHRON WORDMARK */
  .top-left {
    position: absolute;
    top: 72px;
    left: 96px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .wordmark {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 8px;
    line-height: 1;
    background: linear-gradient(120deg,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(255, 255, 255, 0.95) 35%,
      #00d4e8 50%,
      rgba(255, 255, 255, 0.95) 65%,
      rgba(255, 255, 255, 0.95) 100%);
    background-size: 200% 100%;
    background-position: 50% 0;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: #fff;
  }
  .domain {
    font-family: 'Space Grotesk', monospace;
    font-size: 22px;
    color: rgba(0, 212, 232, 0.75);
    letter-spacing: 5px;
    font-weight: 500;
    text-transform: uppercase;
    border-left: 2px solid rgba(0, 212, 232, 0.35);
    padding-left: 28px;
    line-height: 1;
    margin-top: 8px;
  }

  /* Content grid */
  .content {
    position: relative;
    z-index: 10;
    display: grid;
    grid-template-columns: 1fr 1.1fr 1.25fr;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .left-spacer {}

  /* CENTER SCULPTURE */
  .center {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .sculpture-wrap {
    width: 760px;
    height: 760px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .sculpture-wrap::before {
    content: '';
    position: absolute;
    inset: -80px;
    background: radial-gradient(ellipse at center, rgba(0, 200, 230, 0.14) 0%, transparent 65%);
    filter: blur(80px);
    z-index: 0;
  }
  .sculpture {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
  }

  /* RIGHT TAGLINE */
  .right {
    padding-right: 192px;
    text-align: right;
  }
  .tagline {
    font-size: 92px;
    font-weight: 700;
    letter-spacing: -1.6px;
    line-height: 1.05;
    margin-bottom: 44px;
    color: #fff;
    white-space: nowrap;
  }
  .tagline .line2 {
    display: block;
  }
  .liquid-text {
    background: linear-gradient(115deg,
      #ffffff 0%,
      #ffffff 30%,
      #00d4e8 45%,
      #6eeaff 50%,
      #00d4e8 55%,
      #ffffff 70%,
      #ffffff 100%);
    background-size: 200% 100%;
    background-position: 50% 0;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 30px rgba(0, 212, 232, 0.3));
  }
  .subtext {
    font-family: 'Space Grotesk', monospace;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 6px;
    text-transform: uppercase;
  }
  .sep {
    display: inline-block;
    width: 36px;
    height: 2px;
    background: rgba(0, 212, 232, 0.5);
    margin: 0 24px 6px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="bg"></div>
  <div class="noise"></div>
  <div class="vignette"></div>

  <!-- TOP LEFT — Wordmark -->
  <div class="top-left">
    <div class="wordmark liquid-text">TETHRON</div>
    <div class="domain">tethron.ai</div>
  </div>

  <div class="content">
    <div class="left-spacer"></div>

    <!-- CENTER SCULPTURE -->
    <div class="center">
      <div class="sculpture-wrap">
        <img class="sculpture" src="sculpture-v2.png" alt="Tethron">
      </div>
    </div>

    <!-- RIGHT TAGLINE -->
    <div class="right">
      <div class="tagline">The <span class="liquid-text">future</span><span class="line2">works for you.</span></div>
      <div class="subtext">Thinks <span class="sep"></span> Plans <span class="sep"></span> Executes <span class="sep"></span> 24/7</div>
    </div>
  </div>
</div>
</body>
</html>
